<!-- @dsCard group="Actions" height=190 subtitle="Square, as the Bulletin's. Oxblood fill once per view" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Button — preview</title></head>
<body>
<div class="dc-row">
  <button class="dc-btn dc-btn--primary">End turn <kbd>⏎</kbd></button>
  <button class="dc-btn dc-btn--outline">Roll another <kbd>R</kbd></button>
  <button class="dc-btn">Map key</button>
  <button class="dc-btn dc-btn--quiet">Skip</button>
  <div class="dc-tabs" style="margin-left:var(--space-6)"><button aria-pressed="true">World<kbd>E</kbd></button><button aria-pressed="false">Engine</button></div>
</div>
<div class="dc-row dc-paper" data-theme="paper">
  <button class="dc-btn dc-btn--primary">Play from today</button>
  <button class="dc-btn dc-btn--outline">View full statement</button>
  <button class="dc-btn">Track record</button>
  <div class="dc-tabs" style="margin-left:var(--space-6)"><button aria-pressed="true">Anchors</button><button aria-pressed="false">Fan</button><button aria-pressed="false">Date</button><button aria-pressed="false">Hand</button></div>
</div>
</body>
</html>
