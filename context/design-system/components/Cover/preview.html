<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Doom Clock</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .ox { fill: var(--oxblood); }
  .ink { fill: var(--ink); }
  .cut { fill: var(--ground); }
  .alarm { fill: var(--alarm); }
  .ward { fill: var(--ward); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font: 400 100px/95px var(--font-serif); letter-spacing: -.01em; color: var(--ink); }
  .tag { margin: var(--space-2) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--ink-2); }
</style>
</head>
<body>
<div class="cover">
  <div class="art" aria-hidden="true">
    <svg viewBox="0 0 480 288" width="480" height="288">
      <!--
        blocks      oxblood 176×248 bled off the top (the clock's voice, largest) · ink 320×192 bleeding off the right edge · alarm 64×24 and ward 64×24, the two sides, kept small — ≈38% of 960×288
        arrangement one tall oxblood slab beside a wide ink slab, bottoms on one line space-12 above the edge, space-4 gutters; the two side chips ride above the ink slab
        pattern     quarter-circles, from "draw only the last quarter of the face": one 144 quarter cut from the oxblood slab, four shrinking quarters (56, 40, 28, 16) cut from the ink slab, time running out
        scales      sides and gaps in space-2 multiples; gutters space-4; corners radius-0 (square system); quarters are the face's own geometry
      -->
      <rect class="ox" x="0" y="-8" width="176" height="248"/>
      <path class="cut" d="M176,240 L32,240 A144,144 0 0 1 176,96 Z"/>
      <rect class="ink" x="192" y="48" width="320" height="192"/>
      <path class="cut" d="M264,240 L208,240 A56,56 0 0 1 264,184 Z"/>
      <path class="cut" d="M344,240 L304,240 A40,40 0 0 1 344,200 Z"/>
      <path class="cut" d="M408,240 L380,240 A28,28 0 0 1 408,212 Z"/>
      <path class="cut" d="M456,240 L440,240 A16,16 0 0 1 456,224 Z"/>
      <rect class="alarm" x="192" y="16" width="64" height="24"/>
      <rect class="ward" x="264" y="16" width="64" height="24"/>
    </svg>
  </div>
  <div class="words">
    <h1 class="name">Doom Clock</h1>
    <p class="tag">A clock set by markets. One minute is one year.</p>
  </div>
</div>
</body>
</html>
