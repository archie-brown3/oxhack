<!-- @dsCard group="HUD" height=250 subtitle="Top-right of World: which of the 10,000 futures you are watching" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>FutureChip — preview</title></head>
<body>
<div class="dc-row">
  <section class="dc-panel" style="width:290px;display:grid;gap:var(--space-3)" aria-label="Watched future">
    <div style="display:flex;align-items:baseline;gap:var(--space-2)"><b style="font:700 16px/20px var(--font-sans)">Future #4,812</b><span class="dc-faint">of 10,000</span></div>
    <div class="dc-dim">Earlier than 69% of futures. Catastrophe in Q2 2031 in this one.</div>
    <div style="display:grid;gap:var(--space-1)">
      <div style="display:flex;justify-content:space-between"><span class="dc-dim">ASI arrives</span><b>Q1 2028</b></div>
      <div style="display:flex;justify-content:space-between"><span style="color:var(--alarm)">✕ Catastrophe</span><b>Q2 2031</b></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:var(--space-2)">
      <div class="dc-tabs" style="gap:var(--space-3)"><button aria-pressed="false">Early</button><button aria-pressed="true">Typical</button><button aria-pressed="false">Late</button></div>
      <button class="dc-btn dc-btn--outline">Roll <kbd>R</kbd></button>
    </div>
    <span class="dc-data">sim.ts · seed 1 · path 4812</span>
  </section>
</div>
</body>
</html>
