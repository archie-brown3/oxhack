const COLORS={Ailab:"#e5484d",AilabLeader:"#ff8b3e",GovernmentAgency:"#3e9bff",Policymaker:"#6cc4ff",MediaOutlet:"#a78bfa",Journalist:"#c4b5fd",PredictionMarket:"#30c48d",SafetyResearcher:"#f5c542",Person:"#9aa0ad",Organization:"#6b7280",Other:"#4b5563"};
const types=[...new Set(G.nodes.map(n=>n.type))].sort();const on=new Set(types);
const deg={};G.edges.forEach(e=>{deg[e.from]=(deg[e.from]||0)+1;deg[e.to]=(deg[e.to]||0)+1});
const nodes=new vis.DataSet(G.nodes.map(n=>({id:n.id,label:n.name,title:n.type,color:COLORS[n.type]||COLORS.Other,value:1+(deg[n.id]||0),font:{color:getComputedStyle(document.body).color,size:12}})));
const edges=new vis.DataSet(G.edges.map((e,i)=>({id:i,from:e.from,to:e.to,title:e.fact,arrows:"to",color:{color:"#7d8596",opacity:.35}})));
const net=new vis.Network(document.getElementById("net"),{nodes,edges},{nodes:{shape:"dot",scaling:{min:6,max:28}},physics:{stabilization:{iterations:250},barnesHut:{gravitationalConstant:-4000,springLength:120}},interaction:{hover:true}});
